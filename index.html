<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Viewer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .program-buttons {
            display: flex;
            gap: 10px;
        }
        .content {
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Java Programs List</h1>
        
        <!-- Level Selection Dropdown -->
        <div class="row mb-4">
            <div class="col-md-6 offset-md-3">
                <label for="levelSelect" class="form-label">Select Level:</label>
                <select id="levelSelect" class="form-select">
                    <option value="">-- Select Level --</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>
        </div>
        
        <!-- Button to Load Programs -->
        <div class="text-center">
            <button id="loadPrograms" class="btn btn-primary">Load Programs</button>
        </div>

        <!-- Program List -->
        <ol id="programList" class="list-group mt-4" type="1"></ol>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
